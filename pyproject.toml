[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmtools"
version = "1.0.0"
description = "Process architecture, BPM governance and BPMN 2.0 model checks for a fictional company"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pankaj Chaubay" }]
dependencies = ["pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
