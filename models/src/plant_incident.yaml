id: P03.1.1
name: Handle plant incident
owner: Head of Asset Operations
version: "2.1"
lanes: [Control room, Field technician, Asset manager]
nodes:
  - {id: start, type: startEvent, name: Alarm raised in SCADA, lane: Control room}
  - {id: log, type: userTask, name: Log incident, lane: Control room}
  - {id: diag, type: userTask, name: Diagnose fault remotely, lane: Control room}
  - {id: g_remote, type: exclusiveGateway, name: "Fixed remotely?", lane: Control room}
  - {id: disp, type: userTask, name: Dispatch field technician, lane: Control room}
  - {id: repair, type: userTask, name: Fix fault on site, lane: Field technician}
  - {id: g_merge, type: exclusiveGateway, name: "", lane: Control room}
  - {id: verify, type: userTask, name: Verify plant output restored, lane: Control room}
  - {id: g_major, type: exclusiveGateway, name: "Major incident?", lane: Control room}
  - {id: rca, type: userTask, name: Document root cause, lane: Asset manager}
  - {id: g_merge2, type: exclusiveGateway, name: "", lane: Control room}
  - {id: close, type: userTask, name: Close incident, lane: Control room}
  - {id: end, type: endEvent, name: Incident closed, lane: Control room}
flows:
  - [start, log]
  - [log, diag]
  - [diag, g_remote]
  - [g_remote, g_merge, "Yes"]
  - [g_remote, disp, "No"]
  - [disp, repair]
  - [repair, g_merge]
  - [g_merge, verify]
  - [verify, g_major]
  - [g_major, rca, "Yes"]
  - [g_major, g_merge2, "No"]
  - [rca, g_merge2]
  - [g_merge2, close]
  - [close, end]
